name: Test App1

on:
  workflow_dispatch:

jobs:
  build-sdk:
    name: Build SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build Dzaba.Build SDK
        run: |
          dotnet build src/Dzaba.Build.FileCache/Dzaba.Build.FileCache.csproj -c Release
          dotnet build src/Dzaba.Build.Cmd/Dzaba.Build.Cmd.csproj -c Release

      - name: Upload Dzaba.Build SDK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dzaba-build-sdk
          path: |
            src/Dzaba.Build/bin/Release
            src/Dzaba.Build.FileCache/bin/Release
            src/Dzaba.Build.Cmd/bin/Release
          retention-days: 1

  build-lib1:
    name: Build Lib1
    runs-on: ubuntu-latest
    needs: [build-sdk]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /examples/monorepo/Lib1/
            /examples/monorepo/Directory.Build.props
            /examples/monorepo/Directory.Build.targets
            /examples/monorepo/Directory.Packages.props
            /examples/monorepo/Framework.cs
            /examples/monorepo/NuGet.config
            /examples/monorepo/version.json

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Download Dzaba.Build SDK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dzaba-build-sdk
          path: src

      - name: Build Lib1
        run: dotnet build -c Release --no-dependencies -p:DzabaBuildEnabled=true
        working-directory: examples/monorepo/Lib1

  build-app1:
    name: Build App1
    needs: [build-lib1]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /examples/monorepo/App1/
            /examples/monorepo/Directory.Build.props
            /examples/monorepo/Directory.Build.targets
            /examples/monorepo/Directory.Packages.props
            /examples/monorepo/Framework.cs
            /examples/monorepo/NuGet.config
            /examples/monorepo/version.json

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Download Dzaba.Build SDK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dzaba-build-sdk
          path: src

      - name: Build App1
        run: dotnet build -c Release --no-dependencies -p:DzabaBuildEnabled=true
        working-directory: examples/monorepo/App1
